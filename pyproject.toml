[project]
name = "intent-shield"
version = "0.1.0"
description = "Pluggable defense framework against indirect prompt injection attacks on LLM agents"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = [
    "pandas",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_shield"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
